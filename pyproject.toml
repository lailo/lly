[project]
name = "lly"
version = "0.1.0"
description = "Textual TUI to discover and manage Shelly Gen2/Gen3 devices on the LAN"
readme = "README.md"
authors = [
    { name = "Lailo", email = "me@lailo.ch" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "platformdirs>=4.9.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "rich>=13.0.0",
    "structlog>=25.5.0",
    "textual>=8.2.6",
    "tomli-w>=1.2.0",
    "typer>=0.25.1",
    "zeroconf>=0.148.0",
]

[project.scripts]
lly = "lly.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.13",
]
build = [
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "N", "PL", "RUF",
    "ANN", "ASYNC", "TCH", "C4", "PT", "RET", "TID",
]
ignore = [
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW0603",  # module-level config-dir override is intentional
    "TC001",   # we use `from __future__ import annotations`; TYPE_CHECKING blocks are noise
    "TC002",
    "TC003",
    "ANN401",  # zeroconf callback args genuinely need Any
    "ASYNC109",  # timeout params here are scan windows, not asyncio.timeout candidates
    "PLC0415", # local import of lly.tui.app inside CLI callback is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["zeroconf.*", "tomli_w.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
